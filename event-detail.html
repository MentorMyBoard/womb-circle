  <style>
    :root {
      --orange: #f99f1b;
      --orange-soft: #fdebcf;
      --orange-deep: #e08c0a;
      --navy: #191970;
      --navy-deep: #101046;
      --navy-tint: #2b2b8f;
      --ink: #15154a;
      --paper: #ffffff;
      --mist: #f6f6fb;
      --mist2: #eeeef6;
      --line: #e2e2ee;
      --muted: #5d5d7a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box }
    html { scroll-behavior: smooth }
    body { background: var(--paper); color: var(--ink); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased }
    a { text-decoration: none; color: inherit }
    img { display: block; max-width: 100% }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px }

    h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 600; color: var(--navy-deep) }

    /* ── HEADER (same as homepage) ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255, 255, 255, .9); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line); transition: padding .3s;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 40px; max-width: 1320px; margin: 0 auto }
    .nav-logo img { height: 46px; width: auto }
    .nav-links { display: flex; gap: 30px; align-items: center; list-style: none }
    .nav-links a { font-size: .82rem; font-weight: 600; letter-spacing: .02em; color: var(--ink); transition: color .25s }
    .nav-links a:hover { color: var(--orange-deep) }
    .nav-cta { display: flex; gap: 12px; align-items: center }
    .btn {
      font-family: 'Manrope', sans-serif; font-weight: 700; font-size: .8rem; letter-spacing: .03em;
      padding: 11px 22px; border-radius: 40px; cursor: pointer; border: none; transition: all .28s;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .btn-line { background: transparent; color: var(--navy); border: 1.5px solid var(--navy) }
    .btn-line:hover { background: var(--navy); color: #fff }
    .btn-fill { background: var(--orange); color: #fff; box-shadow: 0 6px 18px rgba(249, 159, 27, .32) }
    .btn-fill:hover { background: var(--orange-deep); transform: translateY(-2px); box-shadow: 0 10px 26px rgba(249, 159, 27, .42) }
    .menu-toggle { display: none; background: none; border: none; font-size: 1.6rem; color: var(--navy); cursor: pointer }

    @media (max-width: 980px) {
      .wrap { padding: 0 22px }
      .nav { padding: 12px 22px }
      .nav-links, .nav-cta { display: none }
      .menu-toggle { display: block }
      header.open .nav-links {
        display: flex; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column;
        background: #fff; padding: 18px 22px; gap: 16px; border-bottom: 1px solid var(--line);
      }
      header.open .nav-cta {
        display: flex; position: absolute; top: 100%; left: 0; right: 0; margin-top: 170px;
        flex-direction: column; background: #fff; padding: 0 22px 22px;
      }
      header.open .nav-cta .btn { width: 100%; justify-content: center }
    }

    /* Breadcrumb below the fixed header */
    .ed-breadcrumb { background: var(--mist); padding: 90px 0 14px }
    .ed-breadcrumb .wrap { display: flex }
    .ed-back {
      display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600;
      color: var(--muted); letter-spacing: .02em; transition: color .2s;
    }
    .ed-back:hover { color: var(--navy) }

    /* ── HERO ── */
    .ed-hero-img { width: 100%; aspect-ratio: 16/7; object-fit: cover; background: var(--mist2) }
    .ed-hero-body { padding: 40px 0 8px }
    .ed-meta { font-size: .78rem; font-weight: 700; color: var(--orange-deep); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 10px }
    .ed-hero-body h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.15 }
    .ed-subtitle { color: var(--muted); font-size: 1.08rem; margin-top: 10px; max-width: 720px; line-height: 1.55 }
    .ed-desc { color: var(--ink); font-size: 1rem; line-height: 1.75; margin-top: 22px; max-width: 760px; white-space: pre-line }
    .btn-orange {
      display: inline-block; margin-top: 24px; background: var(--orange); color: #191970; font-weight: 700;
      font-size: .88rem; padding: 13px 26px; border-radius: 9px;
    }

    .ed-section { padding: 40px 0; border-top: 1px solid var(--line) }
    .ed-section h2 { font-size: 1.4rem; margin-bottom: 20px }

    .speaker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px }
    .speaker-card { text-align: center }
    .speaker-card img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px }
    .speaker-avatar {
      width: 92px; height: 92px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 1.6rem;
      font-family: 'Fraunces', serif; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
    }
    .speaker-card h4 { font-size: .95rem }
    .speaker-card p { font-size: .78rem; color: var(--muted); margin-top: 2px }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px }
    .gallery-item { aspect-ratio: 1; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--mist2) }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s }
    .gallery-item:hover img { transform: scale(1.06) }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px }
    .video-frame { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000 }
    .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100% }

    .video-link-card {
      position: relative; aspect-ratio: 16/9; border-radius: 12px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; color: #fff; overflow: hidden;
      transition: transform .2s, box-shadow .2s; background-size: cover; background-position: center;
    }
    .video-link-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(21,21,74,.18) }
    .video-link-label { font-size: .85rem; font-weight: 700 }
    .video-link-linkedin { background-color: #0a66c2; background-image: linear-gradient(160deg, #0a66c2, #084a8f) }
    .video-link-instagram { background-color: #cc2366; background-image: linear-gradient(160deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) }
    .video-link-web { background-color: var(--navy-deep); background-image: linear-gradient(160deg, var(--navy-tint), var(--navy-deep)) }

    /* When a real thumbnail was fetched, swap the centered icon+label for a
       play-button affordance + bottom-anchored label over the actual image. */
    .video-link-card.has-preview { justify-content: flex-end; align-items: flex-start; padding: 14px }
    .video-link-card.has-preview .video-link-icon {
      position: absolute; top: 14px; left: 14px; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,.2); backdrop-filter: blur(4px); display: flex; align-items: center;
      justify-content: center;
    }
    .video-link-card.has-preview .video-link-icon svg { width: 16px; height: 16px }
    .video-link-card.has-preview::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.92);
    }
    .video-link-card.has-preview::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-42%, -50%);
      width: 0; height: 0; border-style: solid; border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent var(--navy);
    }

    .faq-list { max-width: 760px }
    .faq-item { border-bottom: 1px solid var(--line) }
    .faq-item:first-child { border-top: 1px solid var(--line) }
    .faq-q { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; cursor: pointer; font-weight: 600 }
    .faq-icon { color: var(--orange-deep); font-size: 1.1rem; flex-shrink: 0 }
    .faq-a { display: none; color: var(--muted); font-size: .92rem; line-height: 1.6; padding: 0 0 16px }
    .faq-item.open .faq-a { display: block }
    .faq-item.open .faq-icon { transform: rotate(45deg) }

    .success-block { background: var(--mist); border-radius: 18px; padding: 36px }
    .story-badge {
      display: inline-block; background: var(--orange-soft); color: var(--orange-deep); font-size: .7rem;
      font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px;
    }
    .success-block p { color: var(--ink); line-height: 1.7; margin-top: 10px; max-width: 720px }
    .success-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px }
    .success-photos img { border-radius: 12px; aspect-ratio: 4/3; object-fit: cover; width: 100% }
    @media (max-width: 560px) { .success-photos { grid-template-columns: 1fr } }

    .lightbox { display: none; position: fixed; inset: 0; background: rgba(16,16,70,.92); z-index: 999; align-items: center; justify-content: center; padding: 30px }
    .lightbox.open { display: flex }
    .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px }
    .lightbox-close { position: absolute; top: 20px; right: 28px; color: #fff; font-size: 2rem; cursor: pointer }

    footer.ev-footer { background: var(--navy-deep); color: rgba(255,255,255,.5); text-align: center; padding: 22px; font-size: .8rem; margin-top: 40px }
    footer.ev-footer a { color: rgba(255,255,255,.8); font-weight: 600 }
  </style>
</head>
